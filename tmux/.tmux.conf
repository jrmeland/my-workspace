# -- Prefix --
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# -- General settings --
set -g mouse on
set -g history-limit 50000
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -s escape-time 0

# Extended keys (CSI u) — required for Shift+Enter in Claude Code.
# "always" sends CSI u unconditionally (Claude Code doesn't request it itself).
# NOTE: Works over SSH but NOT mosh (mosh drops unknown escape sequences).
# Over mosh, use Ctrl+J or backslash+Enter as a newline alternative.
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'

# -- Plugins (managed by tpm) --
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# Copy mouse selection to clipboard on release (no extra keypress needed)
set -g @yank_action 'copy-pipe'

# Auto-restore sessions on tmux start
set -g @continuum-restore 'on'

# Command palette (prefix + Ctrl-k)
bind-key C-k display-popup -E "tmux list-commands | fzf | xargs -I{} tmux {}"

# Initialize tpm (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
